name: Materialize VCH art

on:
  push:
    branches:
      - codex/set-up-vch-repository-and-implement-chess-game

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/set-up-vch-repository-and-implement-chess-game
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 20.19.0

      - name: Download current VCH art
        run: |
          node scripts/prepare-vch-assets.mjs

          mkdir -p public/assets/vch/pieces/atlas public/assets/vch/wallpapers public/assets/vch/ui

          for f in wk wq wr wb wn wp bk bq br bb bn bp; do
            cp "public/assets/generated/$f.png" "public/assets/vch/pieces/$f.png"
          done

          for f in wallpaper-emerald wallpaper-cobalt wallpaper-burgundy wallpaper-ivory; do
            cp "public/assets/generated/$f.webp" "public/assets/vch/wallpapers/$f.webp"
          done

          for f in hero-knight live-banner opening-card famous-card review-card practice-card reference-ui; do
            cp "public/assets/generated/$f.png" "public/assets/vch/ui/$f.png"
          done

          curl -fL --retry 3 --retry-delay 2             'https://d8j0ntlcm91z4.cloudfront.net/user_3Jebk1qbWpRhC07VOrvPmXEiz8E/hf_20261003_013746_b815f309-1486-4808-9fd4-6f4b5a90fef5.png'             -o public/assets/vch/pieces/atlas/atlas-white.png

          curl -fL --retry 3 --retry-delay 2             'https://d8j0ntlcm91z4.cloudfront.net/user_3Jebk1qbWpRhC07VOrvPmXEiz8E/hf_20261003_013748_e90a13cf-1728-4224-ae48-7e2de94cfd7f.png'             -o public/assets/vch/pieces/atlas/atlas-black.png

      - name: Point VCH at committed art
        run: |
          node <<'NODE'
          const fs=require('fs');

          const replacements={
            '/assets/generated/wk.png':'/assets/vch/pieces/wk.png',
            '/assets/generated/wq.png':'/assets/vch/pieces/wq.png',
            '/assets/generated/wr.png':'/assets/vch/pieces/wr.png',
            '/assets/generated/wb.png':'/assets/vch/pieces/wb.png',
            '/assets/generated/wn.png':'/assets/vch/pieces/wn.png',
            '/assets/generated/wp.png':'/assets/vch/pieces/wp.png',
            '/assets/generated/bk.png':'/assets/vch/pieces/bk.png',
            '/assets/generated/bq.png':'/assets/vch/pieces/bq.png',
            '/assets/generated/br.png':'/assets/vch/pieces/br.png',
            '/assets/generated/bb.png':'/assets/vch/pieces/bb.png',
            '/assets/generated/bn.png':'/assets/vch/pieces/bn.png',
            '/assets/generated/bp.png':'/assets/vch/pieces/bp.png',
            '/assets/generated/pieces-white.png':'/assets/vch/pieces/atlas/atlas-white.png',
            '/assets/generated/pieces-black.png':'/assets/vch/pieces/atlas/atlas-black.png',
            '/assets/generated/wallpaper-emerald.webp':'/assets/vch/wallpapers/wallpaper-emerald.webp',
            '/assets/generated/wallpaper-cobalt.webp':'/assets/vch/wallpapers/wallpaper-cobalt.webp',
            '/assets/generated/wallpaper-burgundy.webp':'/assets/vch/wallpapers/wallpaper-burgundy.webp',
            '/assets/generated/wallpaper-ivory.webp':'/assets/vch/wallpapers/wallpaper-ivory.webp',
            '/assets/generated/hero-knight.png':'/assets/vch/ui/hero-knight.png',
            '/assets/generated/live-banner.png':'/assets/vch/ui/live-banner.png',
            '/assets/generated/opening-card.png':'/assets/vch/ui/opening-card.png',
            '/assets/generated/famous-card.png':'/assets/vch/ui/famous-card.png',
            '/assets/generated/review-card.png':'/assets/vch/ui/review-card.png',
            '/assets/generated/practice-card.png':'/assets/vch/ui/practice-card.png',
            '/assets/generated/reference-ui.png':'/assets/vch/ui/reference-ui.png',
          };

          for(const file of ['src/main.js','src/style.css','public/sw.js','e2e/deployed-preview.spec.js']){
            let text=fs.readFileSync(file,'utf8');
            for(const [from,to] of Object.entries(replacements)) text=text.split(from).join(to);
            fs.writeFileSync(file,text);
          }

          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          delete pkg.scripts['prepare:assets'];
          pkg.scripts['prepare:runtime']='npm run prepare:stockfish';
          fs.writeFileSync('package.json',JSON.stringify(pkg,null,2)+'\n');

          let ignore=fs.readFileSync('.gitignore','utf8');
          ignore=ignore.split('\n').filter(line=>line.trim()!=='public/assets/generated/').join('\n');
          if(!ignore.endsWith('\n'))ignore+='\n';
          fs.writeFileSync('.gitignore',ignore);

          let security=fs.readFileSync('scripts/security-check.mjs','utf8');
          security=security.replace(
            /for \(const asset of \['wk\.png'.*?public\/assets\/generated', asset\)\) failures\.push\(\`prepared VCH visual asset missing: \$\{asset\}\`\);/s,
            `const vchAssets = [
  'pieces/wk.png','pieces/wq.png','pieces/wr.png','pieces/wb.png','pieces/wn.png','pieces/wp.png',
  'pieces/bk.png','pieces/bq.png','pieces/br.png','pieces/bb.png','pieces/bn.png','pieces/bp.png',
  'pieces/atlas/atlas-white.png','pieces/atlas/atlas-black.png',
  'wallpapers/wallpaper-emerald.webp','wallpapers/wallpaper-cobalt.webp','wallpapers/wallpaper-burgundy.webp','wallpapers/wallpaper-ivory.webp',
  'ui/hero-knight.png','ui/live-banner.png','ui/opening-card.png','ui/famous-card.png','ui/review-card.png','ui/practice-card.png','ui/reference-ui.png'
];
for (const asset of vchAssets) if (!existsSync(join('public/assets/vch', asset))) failures.push(\`committed VCH visual asset missing: \$\{asset\}\`);`
          );
          fs.writeFileSync('scripts/security-check.mjs',security);
          NODE

          rm -f scripts/prepare-vch-assets.mjs
          rm -rf public/assets/generated
          rm -f .github/workflows/materialize-vch-assets.yml

      - name: Verify asset migration
        run: |
          test ! -e scripts/prepare-vch-assets.mjs
          test ! -e public/assets/generated
          test -s public/assets/vch/pieces/atlas/atlas-white.png
          test -s public/assets/vch/pieces/atlas/atlas-black.png
          test -s public/assets/vch/ui/reference-ui.png
          test -s public/assets/vch/wallpapers/wallpaper-emerald.webp

          if grep -R --exclude-dir=.git --exclude=package-lock.json -n '/assets/generated\|public/assets/generated\|prepare-vch-assets\|prepare:assets' .; then
            echo 'Old generated-asset pipeline reference remains'
            exit 1
          fi

          if grep -R --exclude-dir=.git -n 'd8j0ntlcm91z4.cloudfront.net\|d2ol7oe51mr4n9.cloudfront.net' public src scripts package.json .gitignore; then
            echo 'Runtime/build source still references remote VCH art'
            exit 1
          fi

          find public/assets/vch -type f -print0 | xargs -0 -n1 test -s

      - name: Commit VCH art into repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Commit VCH art assets locally'
          git push origin HEAD:codex/set-up-vch-repository-and-implement-chess-game
