project_id = "vanta-chess"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["https://vanta-chess-play.netlify.app"]

# The chess function checks sign-ins itself (guests play too), so the gateway JWT check is off.
[functions.chess]
verify_jwt = false
