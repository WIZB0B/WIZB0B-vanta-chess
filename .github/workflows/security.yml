name: Security and build
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 20.19.0
          cache: npm
      - name: Verify project files
        run: |
          pwd
          ls -la package.json package-lock.json
          test -s package-lock.json
          node -e "const p=require('./package-lock.json'); if(!p.lockfileVersion) process.exit(1); console.log('lockfileVersion', p.lockfileVersion)"
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run security
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Upload Playwright test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
      - name: Run live two-browser acceptance
        env:
          VCH_LIVE_E2E: "1"
        run: npx playwright test e2e/live.spec.js --project=desktop
      - name: Capture VCH visual baselines
        env:
          VCH_CAPTURE_VISUAL: "1"
        run: npx playwright test e2e/visual.spec.js --project=desktop
      - name: Upload VCH visual baselines
        uses: actions/upload-artifact@v4
        with:
          name: vch-visual-baselines
          path: test-results/visual/
          if-no-files-found: error
      - name: Wait for Netlify PR preview
        if: github.event_name == 'pull_request'
        env:
          PREVIEW_URL: https://deploy-preview-${{ github.event.pull_request.number }}--vanta-chess-play.netlify.app
        run: |
          for i in {1..30}; do
            if curl -fsS --max-time 10 "$PREVIEW_URL" >/dev/null; then
              echo "Netlify preview ready: $PREVIEW_URL"
              exit 0
            fi
            sleep 5
          done
          echo "Netlify preview did not become ready in time"
          exit 1
      - name: Verify deployed Netlify preview
        if: github.event_name == 'pull_request'
        env:
          VCH_DEPLOYED_PREVIEW: "1"
          VCH_BASE_URL: https://deploy-preview-${{ github.event.pull_request.number }}--vanta-chess-play.netlify.app
        run: npx playwright test e2e/deployed-preview.spec.js --project=desktop
